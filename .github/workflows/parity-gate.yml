name: parity-gate

# Behavioural parity gate: shake each committed fixture once, build it for
# several stage-2 targets, and diff every target's stdout against the committed
# golden (docs/parity.md).  go.yml unit-tests the CLI; nothing there shakes
# anything, so this is the only automated coverage of the shake path.
#
# Not on `push`: a run needs a Shen stage-1 host plus a checkout and toolchain
# per target, so it is minutes rather than seconds.  Nightly + manual.
#
# Two things this job must never do, both of which would make it green while
# gating nothing (see #24):
#
#   * `continue-on-error` on the gate step.  The script exits 3 for "nothing
#     was checkable" -- every toolchain missing.  Swallowing a non-zero status
#     turns a job that checked zero targets into a pass, and also removes the
#     prompt to run the gate by hand.
#   * drop --min-targets.  Without it a runner that has quietly lost a
#     toolchain still reports PASS over a smaller set.  The count is asserted
#     so shrinkage is a failure, not a quieter success.
#
# Reference host: none.  The goldens are committed, so the gate runs with
# --expect and needs no other build; Shen/JIT is the stage-1 host, as the port
# on the kernel in KLambda/, and builds with the runner's C compiler.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      targets:
        description: "comma-separated stage-2 targets"
        default: "jit,go,js,lua"
      min_targets:
        description: "fail unless every fixture checks at least this many"
        default: "4"

concurrency:
  group: parity-gate
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TARGETS: ${{ github.event.inputs.targets || 'jit,go,js,lua' }}
      MIN_TARGETS: ${{ github.event.inputs.min_targets || '4' }}
    steps:
      - uses: actions/checkout@v4

      # shen-go is a stage-2 target here, so an unpinned master makes a red
      # gate unattributable: rendering or port? The SHA lives in
      # .github/shen-go.ref -- one copy for the three workflows that need it.
      # (ShenScript and shen-lua below are still floating; pinning those is
      # separate work.)
      - name: read the pinned shen-go SHA
        run: |
          set -euo pipefail
          ref="$(grep -Eom1 '^[0-9a-f]{40}$' .github/shen-go.ref)"
          echo "SHEN_GO_REF=$ref" >> "$GITHUB_ENV"
          echo "shen-go pinned at $ref (.github/shen-go.ref)"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: luajit (lua target)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq luajit

      # Sibling port checkouts. builders.json resolves each target's port via
      # {yggroot}/../<name>, overridable per target with a YGGDRASIL_SHEN_*_DIR
      # env var; ../ of the workspace is writable, so plain siblings work.
      - name: check out the stage-2 ports
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/.."
          # Full clone for shen-go: a shallow one carries no object to check
          # SHEN_GO_REF out of.
          git clone -q https://github.com/pyrex41/shen-go.git
          git -C shen-go checkout -q "$SHEN_GO_REF"
          echo "shen-go pinned at $(git -C shen-go rev-parse HEAD)"
          git clone --depth 1 -b master https://github.com/pyrex41/ShenScript.git
          git clone --depth 1 -b main   https://github.com/pyrex41/shen-lua.git

      # Full install, NOT --omit=dev. ShenScript's `prepare` hook renders
      # lib/kernel.js on a fresh checkout and that renderer needs parsimmon,
      # which is a devDependency -- so --omit=dev installs, then immediately
      # fails the hook with "Cannot find package 'parsimmon'".  (Its runtime
      # dep, astring, is the only prod one, which is what made --omit=dev look
      # sufficient.)
      - name: ShenScript deps
        run: npm ci
        working-directory: ${{ github.workspace }}/../ShenScript

      # The stage-1 host: the Shen/JIT release pinned in .github/shen-jit.ref,
      # the only maintained port on the kernel in KLambda/.
      - name: build the Shen/JIT stage-1 host (pinned)
        run: sh .github/build-shen-jit.sh "$GITHUB_WORKSPACE/../shen-jit"

      - name: parity gate
        env:
          YGGDRASIL_HOST: ${{ github.workspace }}/../shen-jit/build/shen-jit
          YGGDRASIL_SHEN_JIT_DIR: ${{ github.workspace }}/../shen-jit
          YGGDRASIL_SHEN_GO_DIR: ${{ github.workspace }}/../shen-go
          YGGDRASIL_SHENSCRIPT_DIR: ${{ github.workspace }}/../ShenScript
          YGGDRASIL_SHEN_LUA_DIR: ${{ github.workspace }}/../shen-lua
        run: ./scripts/parity-gate.sh --targets "$TARGETS" --min-targets "$MIN_TARGETS"
