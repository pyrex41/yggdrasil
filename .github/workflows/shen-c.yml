name: shen-c-native-rc

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  native-manifest:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: yggdrasil
      - uses: actions/checkout@v4
        with:
          repository: pyrex41/shen-c
          ref: 27fe901f2ce42d03cb9890bcc9729b034efb9e68
          path: shen-c
      - uses: actions/setup-go@v5
        with:
          go-version-file: yggdrasil/go.mod
          cache: false
      - name: Test native manifest, initialization and arity registration
        working-directory: yggdrasil
        env:
          YGGDRASIL_SHEN_C_DIR: ${{ github.workspace }}/shen-c
          PKG_CONFIG: /nonexistent/no-boehm-or-pkg-config
        run: go test -tags shen_c -count=1 -timeout 3m -run 'TestCBuilder' -v .
