name: shen-c-native-rc

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  native-manifest:
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            cc: clang-18
            ar: llvm-ar-18
          - os: macos-latest
            cc: clang
            ar: ar
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: yggdrasil
      - uses: actions/checkout@v4
        with:
          repository: pyrex41/shen-c
          ref: 27fe901f2ce42d03cb9890bcc9729b034efb9e68
          path: shen-c
      - uses: actions/setup-go@v5
        with:
          go-version-file: yggdrasil/go.mod
          cache: false
      - name: Build the pinned Shen/JIT stage-1 host
        run: sh yggdrasil/.github/build-shen-jit.sh shen-jit
      - name: Test native manifest and dynamic-load dependency closure
        working-directory: yggdrasil
        env:
          YGGDRASIL_SHEN_C_DIR: ${{ github.workspace }}/shen-c
          PKG_CONFIG: /nonexistent/no-boehm-or-pkg-config
          CC: ${{ matrix.cc }}
          AR: ${{ matrix.ar }}
          YGGDRASIL_DYNAMIC_HOST: ${{ github.workspace }}/shen-jit/build/shen-jit
        run: go test -tags shen_c -count=1 -timeout 8m -run 'TestCBuilder|TestDynamicLoadClosure' -v .
