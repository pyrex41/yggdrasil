name: shen-c-native-rc

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  native-manifest:
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: yggdrasil
      - uses: actions/checkout@v4
        with:
          repository: pyrex41/shen-c
          ref: 27fe901f2ce42d03cb9890bcc9729b034efb9e68
          path: shen-c
      - uses: actions/checkout@v4
        with:
          repository: pyrex41/shen-go
          ref: 1f587de815e2583e204398f3b2989a88154ca192
          path: shen-go
      - uses: actions/setup-go@v5
        with:
          go-version-file: yggdrasil/go.mod
          cache: false
      - name: Build pinned stage-1 host
        working-directory: shen-go
        run: go build -o bin/shen-go ./cmd/shen
      - name: Test native manifest and dynamic-load dependency closure
        working-directory: yggdrasil
        env:
          YGGDRASIL_SHEN_C_DIR: ${{ github.workspace }}/shen-c
          PKG_CONFIG: /nonexistent/no-boehm-or-pkg-config
          CC: clang
          YGGDRASIL_DYNAMIC_HOST: ${{ github.workspace }}/shen-go/bin/shen-go
        run: go test -tags shen_c -count=1 -timeout 5m -run 'TestCBuilder|TestDynamicLoadClosure' -v .
